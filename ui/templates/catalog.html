        <section class="pane document-pane" aria-label="目标文档">
          <div class="document-top"><div class="file-name"><span class="file-icon" aria-hidden="true">▤</span>行业观察（草稿）</div><div class="document-meta">未发布</div></div>
          <div class="doc-wrap"><article class="doc-sheet">
            <h2>行业观察与背景</h2>
            <p>这是一份正在编辑的研究草稿。已有段落说明研究对象和观察范围，下一节将继续梳理行业背景。</p>
            <h3>一、发展背景</h3>
            <p>近年来，行业的供给方式和用户预期持续变化。撰写这一节时，需要结合资料来源和已有文段，保持整份文档的语气一致。</p>
            <button type="button" class="target-slot" id="targetSlot" aria-label="选择发展背景下方作为插入位置">在此处插入</button>
            <div id="generatedSlot" tabindex="-1"></div>
            <div class="doc-bottom" aria-hidden="true"></div>

        <button type="button" class="direction-action" id="directionCollapse" aria-label="折叠推荐方向和内容包"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#icon-chevron-down"/></svg>折叠</button>

    <div class="toast glass" id="toast" role="status" hidden></div>

    <script>
      /* @tuotie:companion-asset-base */
      /* @tuotie:companion-components */
      /* @tuotie:companion-motion */
      document.getElementById('dockOrb').outerHTML=companionMarkup({id:'dockOrb',className:'orb',pose:'idle'});
      let companionRunSequence=0, previousCompanionPhase='', companionRunCancelled=false;
      let previousCompanionItems=null,companionContentSequence=0,companionPendingNod='';
      let companionRestoringItems=new Set();
      function syncDockCompanion() {
        const items=new Set(state.items);
        if(previousCompanionItems&&[...items].some(id=>!previousCompanionItems.has(id)&&!companionRestoringItems.has(id))&&state.phase==='collect') {
          companionPendingNod=`content:${++companionContentSequence}`;
        }
        previousCompanionItems=items;
        for(const id of items)companionRestoringItems.delete(id);
        if(state.phase==='generating'&&previousCompanionPhase!=='generating') {
          companionRunSequence++;companionRunCancelled=false;companionPendingNod='';
        }
        const live=window.TuotieDesktopLive;
        const resultPhase=live?.resultPhase?.();
        const uncertain=live?.resultUncertain?.();
        const error=live?.resultError?.();
        const failed=uncertain||error||(resultPhase&&!['preview','done'].includes(resultPhase));
        const explicitFailure=state.phase!=='generating'&&!uncertain&&error&&['error','done'].includes(resultPhase);
        const pose=explicitFailure?'failure':state.phase==='generating'?'working':state.phase==='done'&&!failed?'success':
          state.phase==='direction'&&(!resultPhase||resultPhase==='planning')?'thinking':
          state.phase==='collect'&&companionPendingNod?'nod':'idle';
        const nodKey=companionPendingNod;
        window.TuotieCompanionMotion.setPose(document.getElementById('dockOrb'),pose,{
          eventKey:pose==='nod'?nodKey:`${pose}:${companionRunSequence}${pose==='success'&&companionRunCancelled?':retained':''}${pose==='failure'?':'+error:''}`,
          animate:pose!=='success'||(companionRunSequence>0&&!companionRunCancelled),
          onComplete:pose==='nod'?()=>{if(companionPendingNod===nodKey){companionPendingNod='';syncDockCompanion();}}:undefined,
        });
        previousCompanionPhase=state.phase;
      }
      window.TuotieCompanionState=Object.freeze({refresh:syncDockCompanion,hydrateItems(ids){companionRestoringItems=new Set(ids);companionPendingNod='';},cancelRun(){companionRunCancelled=true;companionPendingNod='';syncDockCompanion();}});
      const sources = [
        { id: 'text', kind: 'text', title: '行业趋势摘录', type: '文字', origin: '研究资料页', sourceKind: 'web', url: 'demo-sources.html#research', detail: '过去五年，行业服务逐步从单一交付转向更紧密的协作。用户更关注结果与过程是否贴合自己的工作语境，而不只是得到一段通用内容。' },
        { id: 'image', kind: 'image', title: '展览现场照片', type: '图片', origin: '本地相册', sourceKind: 'app', url: 'demo-sources.html#gallery', detail: '暖色调的展览现场照片，作为图片类素材的预览示例。' },
        { id: 'table', kind: 'table', title: '季度观察数据', type: '表格', origin: '项目资料表', sourceKind: 'file', url: 'demo-sources.html#dataset', detail: '' },
        { id: 'video', kind: 'video', title: '访谈片段', type: '视频', origin: '本地文件', sourceKind: 'file', url: '', detail: '视频素材的预览位置。' },
      ];
      const $ = (selector) => document.querySelector(selector);
      const icon = (name, className = '') => `<svg class="ui-icon ${className}" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#icon-${name}"/></svg>`;
      /* @tuotie:content-components */
      const {contentKind,contentLabel,contentTitle,contentText,contentPreview,escapeHtml,thumb,originMarkup,sourceMeta,bundlePreview,bundleCard} = createContentComponents({icon,document});
      const toolbarIcon = name => `<svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#icon-${name}"/></svg>`;
      const botSvg = (status = '') => companionMarkup({className:`orb ${status}`,pose:({generating:'working',done:'success',thinking:'thinking'})[status]||'idle'});
      const microphoneSvg = '<svg class="microphone-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3m-3 0h6"/></svg>';
      const demoBot = (status = '', interactive = false, label = '查看当前面板') => `<div class="pet-anchor" title="按住拖动可调整位置">${interactive ? `<button type="button" class="demo-bot" aria-label="${label}；拖动可调整位置">${botSvg(status)}</button>` : `<div class="demo-bot">${botSvg(status)}</div>`}</div>`;
      function mentionTokenMarkup(part, demo = false) {
        const target = part.kind === 'target';
        const id = target ? (demo ? part.id || 'document' : state.target) : part.id;
        const item = target ? sources.find(source => source.id === id) : sources.find(source => source.id === part.id);
        if (!target && !item || target && !id) return '';
        const label = target ? targetName(id) : item.kind === 'text' ? contentText(item) : item.title;
        const chars = Array.from(label);
        const shortLabel = chars.length > 7 ? chars.slice(0, 7).join('') + '…' : label;
        const iconName = target ? 'scan' : `type-${contentKind(item.kind)}`;
        const href = target ? `#${item ? `source-${item.id}` : 'targetSlot'}` : item.url || `#source-${item.id}`;
        return `<span class="reference-tag mention-token ${target ? 'target-reference' : 'source-reference'}" data-mention-kind="${part.kind}" data-mention-id="${escapeHtml(id)}" contenteditable="false"><a class="mention-token-link" href="${escapeHtml(href)}" ${!target && item.url ? 'target="_blank" rel="noopener noreferrer"' : ''} data-mention-jump="true" aria-label="跳转到${target ? '目标位置' : '素材来源'}：${escapeHtml(label)}">${icon(iconName)}<span title="${escapeHtml(label)}">${escapeHtml(shortLabel)}</span></a><button type="button" class="mention-token-remove" data-mention-remove="true" aria-label="删除引用：${escapeHtml(label)}">${icon('x')}</button></span>`;
      }
      function draftMarkup(role, demo = false) {
        return (state.drafts[role] || []).map(part => part.kind === 'text' ? escapeHtml(part.value).replace(/\n/g, '<br>') : mentionTokenMarkup(part, demo)).join('');
      }
      function mentionEditorMarkup(role, id, label, placeholder, initial = '') {
        const demo = role.startsWith('demo-');
        const demoContent = Array.isArray(initial) ? initial.map(part => typeof part === 'string' ? escapeHtml(part) : mentionTokenMarkup(part, true)).join('') : escapeHtml(initial);
        const content = Object.hasOwn(state.drafts, role) ? draftMarkup(role, demo) : demo ? demoContent : '';
        return `<div class="mention-editor" id="${id}" data-draft="${role}" data-placeholder="${escapeHtml(placeholder)}" role="textbox" aria-label="${escapeHtml(label)}" aria-multiline="true" aria-expanded="false" contenteditable="true">${content}</div>`;
      }
      /* @tuotie:task-components */

      function syncWorkPrimary(input) {
        const button = input?.closest('.work-composer')?.querySelector('.work-send');
        if (button) button.hidden = !editorText(input).trim();
      }
      function updateProcessingClocks() {
        const liveInput = $('#taskInput');
        if (liveInput && state.phase === 'generating') {
          const elapsed = state.processingElapsedMs + Date.now() - state.processingStartedAt;
          liveInput.dataset.placeholder = window.TuotieDesktopLive?.processingHint?.(Math.floor(elapsed / 1000)) || `已处理 ${Math.floor(elapsed / 1000)} 秒`;
        }
        const demoInput = $('#demoWorkInput');
        if (demoInput) demoInput.dataset.placeholder = `已处理 ${Math.floor((Date.now() - previewProcessingStartedAt) / 1000)} 秒`;
      }
      let previewProcessingStartedAt = Date.now();
      const workingPreview = () => `<div class="demo-stack work-preview task-preview">${demoBot('generating', true, '展开工作输入框')}<div class="work-panel">${workComposer(true)}</div></div>`;
      const state = {
        mode: 'source-first', auto: false, items: [], activeItems: [], runItems: [], selected: new Set(), target: null,
        phase: 'collect', collapsed: true, petCollapsed: false, followupOpen: false, atTarget: false, intent: 0,
        generated: '', acceptedOutputs: [], history: [], pendingPrevious: '', pendingExtra:'', pendingAppliedLength:2, pendingAppliedTone:'same', extra: '', workInputs:[], length: 2, tone: 'same', appliedLength:2, appliedTone:'same', processingStartedAt:0, processingElapsedMs:0, drafts:{ intent:[], task:[], followup:[], 'demo-followup':[] },
      };
      let selection = null;
      let dragging = [];
      let generationTimer = null;
      let generationVersion = 0;
      let toastTimer = null;
      let dockMoved = false;
      let directionBackOpen = false;
      let detailReturnFocus = null;

        if (group === 'selection') {
          const disabled = variant === 'disabled' ? 'disabled' : '';
          return `<div class="demo-context">撰写这一节时，需要结合 <mark>行业资料中的观察</mark> 与已有内容，保持文档语气一致。</div><div class="demo-toolbar demo-glass" role="toolbar" aria-label="选区操作"><button type="button" ${disabled}>${toolbarIcon('plus')}加入内容包</button><button type="button" hidden ${disabled}>${toolbarIcon('scan')}设为目标位置</button></div>`;
        }
        if (group === 'bundle') {
          const items = variant === 'empty' ? '' : variant === 'target'
            ? demoBundleCard(sources[0])
            : sources.map((item,index) => demoBundleCard(item, variant === 'selected' && index < 2)).join('');
          const count = variant === 'empty' ? 0 : variant === 'target' ? 1 : sources.length;
          const minimized = variant === 'empty' || variant === 'collapsed';
          return `<div class="demo-stack ${minimized ? 'demo-collapsed' : ''}">${demoBot('', minimized, '展开内容包')}<div class="demo-bundle demo-glass"><div class="demo-bundle-top"><span class="bundle-title"><strong>内容包</strong><span class="bundle-count">${count}</span></span><span class="demo-chevron" aria-hidden="true">${icon('chevron-down')}</span></div>${items || '<div class="demo-empty">尚未添加内容</div>'}${variant === 'target' ? `<div class="target-footer demo-target-footer" aria-label="目标插入位置">${targetFooterBody('document', true)}</div>` : ''}</div></div>`;
        }
        if (group === 'assets') {
          if (variant === 'mentions') return `<div class="asset-board"><h2>输入引用</h2><p>输入 @ 后，点选下方素材即可引用。点击标签可跳转，悬浮标签可移除引用。</p><div class="composer direction-composer demo-glass mention-demo-composer">${mentionEditorMarkup('demo-mentions', 'demoMentionInput', '引用内容示意', '输入 @ 引用内容', ['参考 ', { kind:'source', id:'text' }, '，请补充说明。'])}</div>${bundleCard(sources[0], false, true)}</div>`;
          if (variant === 'types') {
            const typeItems = [['text','文字','选中的文段'],['image','图片','图片素材'],['table','表格','表格数据'],['video','视频','视频片段'],['document','文档','整份文件']];
            return `<div class="asset-board"><h2>内容类型头像</h2><p>图标表示加入内容包的内容；所有类型使用同一种纯色底。</p><div class="asset-grid">${typeItems.map(([kind,label,note]) => `<div class="asset-cell">${thumb(kind)}<span><strong>${label}</strong><small>${note}</small></span></div>`).join('')}</div></div>`;
          }
          if (variant === 'origins') {
            const examples = [[sources[0],'网页，无专属图标'],[sources[1],'应用，无专属图标'],[sources[2],'本地文件'],[{ origin:'共享链接', sourceKind:'unknown', url:'demo-sources.html#shared' },'来源类别未知'],[sources[3],'暂时无法打开']];
            return `<div class="asset-board"><h2>来源图标</h2><p>有专属图标时使用网站或应用的单色标志；没有时使用对应的通用图标。可打开的来源名称显示为链接。</p><div class="asset-origin-list">${examples.map(([item,note]) => `<div class="asset-origin-row">${originMarkup(item)}<span>${note}</span></div>`).join('')}</div></div>`;
          }
          const tagExamples = [[sourceReference('行业趋势摘录','text'),'文字'],[sourceReference('展览现场照片','image'),'图片'],[sourceReference('季度观察数据','table'),'表格'],[sourceReference('访谈片段','video'),'视频'],[sourceReference('整份资料','document'),'文档']];
          return `<div class="asset-board"><h2>文中标签</h2><p>标签本身不另设点击操作。图标沿用内容类型头像的线条图形，不加第二层底色。</p><div class="asset-tag-list">${tagExamples.map(([tag,label]) => `<p>参考 ${tag} 补充内容 <span class="content-type">${label}</span></p>`).join('')}<p>在 ${targetReference('发展背景')} 下方插入内容 <span class="content-type">插入位置</span></p></div></div>`;
        }
        if (group === 'direction') {
          if (variant === 'auto') return workingPreview();
          return `<div class="demo-stack demo-direction-stack ${variant === 'collapsed' ? 'demo-direction-collapsed' : ''}">${demoBot('thinking', true, variant === 'collapsed' ? '展开推荐方向和内容包' : '显示返回和折叠操作')}<div class="direction-actions glass" data-demo-direction-actions="true" role="group" aria-label="助手操作" hidden><button type="button" class="direction-action" data-demo-back-direction="true" aria-label="返回内容选择">${icon('arrow-left')}返回</button><button type="button" class="direction-action" data-demo-collapse-direction="true" aria-label="折叠推荐方向和内容包">${icon('chevron-down')}折叠</button></div><div class="demo-intent">${directionOptions(sourceReference('行业趋势摘录'), targetReference('发展背景'), true)}<div class="composer direction-composer demo-glass">${mentionEditorMarkup('demo-intent', 'demoIntentInput', '自定义生成方向示意', '输入要求，@ 引用内容', variant === 'custom' ? '写成更易读的短段落' : '')}<button type="button" class="icon-button" data-demo-voice="true" aria-label="语音输入暂不可用" title="语音输入暂不可用" disabled>${microphoneSvg}</button><button type="button" class="icon-button send" data-demo-start="true" aria-label="发送自定义方向并开始生成">${icon('arrow-up')}</button></div></div><div class="demo-bundle demo-glass demo-direction-bundle"><div class="demo-bundle-top"><span class="bundle-title"><strong>内容包</strong><span class="bundle-count">1</span></span><span class="demo-chevron" aria-hidden="true">${icon('chevron-down')}</span></div>${bundleCard(sources[0], false, true)}<div class="target-footer demo-target-footer" aria-label="目标插入位置">${targetFooterBody('document', true)}</div></div></div>`;
        }
        if (group === 'assistant') {
          if (variant === 'idle') return `<div class="demo-avatar">${demoBot()}</div>`;
          if (variant === 'generating') return workingPreview();
          return `<div class="demo-stack task-preview">${demoBot('done')}<div class="demo-task task-complete">${completionHeader(true)}${variant === 'adjustment' ? adjustmentMarkup(true) : ''}</div>${variant === 'adjustment' ? bundleCard(sources[0], false, true) : ''}</div>`;
        }
        return '';
      }
      function renderCatalog() {
        closeMentionMenu();
        const group = catalogGroups.find(item => item.id === catalogSelection.group);
        const variant = group.states.find(item => item[0] === catalogSelection.variant);
        $('#catalogPath').textContent = group.title;
        $('#catalogTitle').textContent = `${group.title}：${variant[1]}`;
        $('#catalogDescription').textContent = group.summary;
        $('#previewStateLabel').textContent = variant[1];
        const quietPreview = (group.id === 'direction' && variant[0] === 'auto') || (group.id === 'assistant' && ['generating','done','adjustment'].includes(variant[0]));
        $('#previewNote').hidden = quietPreview;
        $('#previewNote').textContent = quietPreview ? '' : variant[2];
        $('#previewComponent').querySelectorAll('.companion-character').forEach(root=>window.TuotieCompanionMotion.dispose(root));
        $('#previewComponent').innerHTML = catalogMarkup(group.id, variant[0]);
        $('#previewComponent').querySelectorAll('.companion-character').forEach(root=>{
          window.TuotieCompanionMotion.setPose(root,root.dataset.companionPose,{eventKey:`catalog:${group.id}:${variant[0]}`});
          if($('#controlMotion').checked)window.TuotieCompanionMotion.pause(root);
        });
        updateProcessingClocks();
        syncWorkPrimary($('#demoWorkInput'));
        syncAdjustmentSubmit($('#demoFollowupInput'));
        if (group.id === 'selection') positionSelectionPreview();
        const stack = $('#previewComponent .demo-stack');
        if (stack?.classList.contains('demo-direction-stack')) setDemoDirectionBack(stack, false);
        const offset = previewOffsets.get(group.id);
        if (stack && offset) {
          stack.style.left = `${offset.left}px`; stack.style.top = `${offset.top}px`;
          dragBounds(stack, $('#componentStage').getBoundingClientRect(), false);
          previewOffsets.set(group.id, { left:parseFloat(stack.style.left), top:parseFloat(stack.style.top) });
        }
        const revealPreview = $('#previewComponent .work-preview, #previewComponent .demo-collapsed');
        if (revealPreview) {
          revealPreview.querySelector('.pet-anchor').addEventListener('pointerenter', () => revealPreview.classList.add('controls-open'));
          revealPreview.addEventListener('pointerleave', () => { if (revealPreview.classList.contains('is-dragging')) return; if (revealPreview.querySelector('.pet-anchor').contains(document.activeElement)) document.activeElement.blur(); revealPreview.classList.remove('controls-open'); setDemoDirectionBack(revealPreview, false); });
        }
        $('#previewComponent').classList.toggle('no-motion', $('#controlMotion').checked);
      }
      function positionSelectionPreview() {
        const preview = $('#previewComponent');
        const selection = preview.querySelector('.demo-context mark');
        const toolbar = preview.querySelector('.demo-toolbar');
        if (!selection || !toolbar) return;
        const selectedRect = selection.getBoundingClientRect();
        const previewRect = preview.getBoundingClientRect();
        const left = Math.max(8, Math.min(selectedRect.left - previewRect.left - 4, preview.clientWidth - toolbar.offsetWidth - 8));
        toolbar.style.left = `${left}px`;
        toolbar.style.top = `${selectedRect.top - previewRect.top - toolbar.offsetHeight - 7}px`;
      }
      function selectCatalog(group, variant, options = {}) {
        if (catalogSelection.group === 'assistant' && catalogSelection.variant === 'generating' && group === 'assistant' && ['done','adjustment'].includes(variant) && !options.stopped) {
          state.drafts['demo-followup'] = [];
        }
        if ((group === 'assistant' && variant === 'generating') || (group === 'direction' && variant === 'auto')) previewProcessingStartedAt = Date.now();
        catalogSelection = { group, variant };
        document.body.classList.remove('flow-mode'); document.body.classList.add('catalog-mode');
        hideMenu(); renderCatalogNav(); renderCatalog();
      }
      function showFlow(mode) {
        document.body.classList.remove('catalog-mode'); document.body.classList.add('flow-mode');
        reset(mode); renderCatalogNav();
      }
      function updateCatalogControls() {
        const stage = $('#componentStage');
        const displacement = Number($('#controlDisplacement').value);
        const blur = Number($('#controlBlur').value);
        const saturation = Number($('#controlSaturation').value);
        const aberration = Number($('#controlAberration').value);
        const elasticity = Number($('#controlElasticity').value);
        const radius = Number($('#controlRadius').value);
        stage.style.setProperty('--g-blur', `${6 + blur * 2}px`);
        stage.style.setProperty('--g-saturation', `${saturation}%`);
        stage.style.setProperty('--g-elasticity', elasticity);
        stage.style.setProperty('--g-radius', `${radius}px`);
        stage.style.setProperty('--g-shift', `${((displacement - 70) / 8).toFixed(1)}px`);
        stage.style.setProperty('--g-highlight', String(Math.min(.85, .25 + aberration * .1)));
        stage.style.setProperty('--g-chroma', `${(aberration * .45).toFixed(1)}px 0 0 var(--orange-a5)`);
        stage.style.setProperty('--g-angle', `${145 + (displacement - 70) * .35}deg`);
        stage.dataset.mode = $('#controlMode').value;
        stage.dataset.backdrop = $('#controlBackdrop').value;
        stage.dataset.overLight = String($('#controlOverLight').checked);
        $('#outDisplacement').textContent = displacement;
        $('#outBlur').textContent = `${6 + blur * 2}px`;
        $('#outSaturation').textContent = `${saturation}%`;
        $('#outAberration').textContent = aberration;
        $('#outElasticity').textContent = `${Math.round(elasticity * 100)}%`;
        $('#outRadius').textContent = `${radius}px`;
        $('#previewComponent').classList.toggle('no-motion', $('#controlMotion').checked);
        $('#previewComponent').querySelectorAll('.companion-character').forEach(root=>{
          window.TuotieCompanionMotion[$('#controlMotion').checked?'pause':'resume'](root);
        });
      }
      $('#catalogNav').addEventListener('click', event => {
        const flow = event.target.closest('[data-flow]'); if (flow) { showFlow(flow.dataset.flow); return; }
        const item = event.target.closest('[data-catalog-group]');
        if (item) { if (item.dataset.catalogVariant === 'generating' || item.dataset.catalogVariant === 'auto') previewGenerationOrigin = 'direction'; selectCatalog(item.dataset.catalogGroup, item.dataset.catalogVariant); }
      });
      enableDragging($('#previewComponent'), event => {
        const hit = event.target.closest('.demo-stack .pet-anchor, .demo-stack .demo-bundle-top, .demo-stack .direction-option, .demo-stack .demo-task h3');
        const stack = hit?.closest('.demo-stack');
        if (!stack) return null;
        const handle = event.target.closest('button') || hit;
        return { element:stack, handle, bounds:() => $('#componentStage').getBoundingClientRect(), fixed:false,
          onEnd:() => { dragBounds(stack, $('#componentStage').getBoundingClientRect(), false); previewOffsets.set(catalogSelection.group, { left:parseFloat(stack.style.left), top:parseFloat(stack.style.top) }); } };
      });
      $('#previewComponent').addEventListener('click', event => {
        if (event.target.closest('.origin-link')) return;
        const directionBot = event.target.closest('.demo-direction-stack .demo-bot');
        if (directionBot) {
          const stack = directionBot.closest('.demo-direction-stack');
          stack.classList.toggle('demo-direction-collapsed');
          setDemoDirectionBack(stack, false);
          return;
        }
        if (event.target.closest('[data-demo-back-direction]')) { selectCatalog('bundle', 'selected'); return; }
        if (event.target.closest('[data-demo-collapse-direction]')) { const stack = event.target.closest('.demo-direction-stack'); stack.classList.add('demo-direction-collapsed'); setDemoDirectionBack(stack, false); return; }
        const detail = event.target.closest('[data-demo-detail]');
        if (detail) { showDetail(detail.dataset.demoDetail, detail); return; }
        const removeCard = event.target.closest('[data-demo-remove]');
        if (removeCard) {
          removeCard.closest('.demo-bundle-card')?.remove();
          const bundle = $('#previewComponent .demo-bundle');
          const count = bundle?.querySelectorAll('.demo-bundle-card').length || 0;
          if (bundle) { bundle.querySelector('.bundle-count').textContent = String(count); if (!count) bundle.querySelector('.demo-bundle-top').insertAdjacentHTML('afterend', '<div class="demo-empty">尚未添加内容</div>'); }
          return;
        }
        const selectCard = event.target.closest('[data-demo-card]');
        if (selectCard) {
          const selected = selectCard.classList.toggle('selected');
          const selectButton = selectCard.querySelector('[data-demo-select]');
          selectButton.setAttribute('aria-pressed', String(selected));
          selectButton.setAttribute('aria-label', `${selected ? '取消选择' : '选择'}${sources.find(item => item.id === selectCard.dataset.demoCard)?.title || '素材'}`);
          return;
        }
        if (event.target.closest('[data-demo-accept]')) { state.drafts['demo-followup'] = []; selectCatalog('bundle', 'empty'); return; }
        if (event.target.closest('[data-demo-undo]')) { selectCatalog('direction', 'multiple'); return; }
        if (event.target.closest('[data-demo-remove-target]')) { event.target.closest('.target-footer')?.remove(); return; }
        if (event.target.closest('[data-demo-jump]')) {
          event.preventDefault(); showFlow('target-first'); setTarget('document'); $('#targetSlot').focus(); return;
        }
        if (event.target.closest('[data-demo-intent]')) { previewGenerationOrigin = 'direction'; selectCatalog('assistant', 'generating'); return; }
        if (event.target.closest('[data-demo-start]')) {
          const value = editorText($('#demoIntentInput')).trim();
          if (value) { previewGenerationOrigin = 'direction'; selectCatalog('assistant', 'generating'); } else showToast('请先输入生成方向');
          return;
        }
        if (event.target.closest('[data-demo-work-send]')) { const input = $('#demoWorkInput'); if (editorText(input).trim()) { clearEditor(input); showToast('已记录补充要求'); } return; }
        if (event.target.closest('[data-demo-followup]')) { selectCatalog('assistant', 'adjustment', {preserveAdjustment:true}); $('#demoFollowupInput')?.focus({preventScroll:true}); return; }
        if (event.target.closest('[data-demo-stop]')) { selectCatalog(previewGenerationOrigin === 'done' ? 'assistant' : 'direction', previewGenerationOrigin === 'done' ? 'done' : 'multiple', { stopped:true }); return; }
        const suggestion = event.target.closest('[data-adjust-option]');
        if (suggestion) { applyQuickAdjustment(Number(suggestion.dataset.adjustOption), true); return; }
        if (event.target.closest('[data-adjust-submit]')) { if (editorText($('#demoFollowupInput')).trim()) { previewGenerationOrigin = 'done'; selectCatalog('assistant', 'generating'); } return; }
        if (event.target.closest('[data-demo-voice]')) { showToast('语音输入暂不可用'); return; }
      });
      $('#previewComponent').addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.target.id === 'demoIntentInput') {
          event.preventDefault();
          const value = editorText(event.target).trim();
          if (value) { previewGenerationOrigin = 'direction'; selectCatalog('assistant', 'generating'); } else showToast('请先输入生成方向');
        } else if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.target.id === 'demoWorkInput' && editorText(event.target).trim()) {
          event.preventDefault();
          clearEditor(event.target); showToast('已记录补充要求');
        } else if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.target.id === 'demoFollowupInput') {
          event.preventDefault(); if (editorText(event.target).trim()) { previewGenerationOrigin = 'done'; selectCatalog('assistant', 'generating'); }
        }
      });

      $('#openFlow').addEventListener('click', () => showFlow(catalogSelection.variant === 'target' ? 'target-first' : 'source-first'));
      window.addEventListener('resize', () => { if (document.body.classList.contains('catalog-mode') && catalogSelection.group === 'selection') positionSelectionPreview(); });
      document.querySelectorAll('.control-panel input,.control-panel select').forEach(input => input.addEventListener('input', updateCatalogControls));
      $('#resetControls').addEventListener('click', () => {
        const values = { controlDisplacement:'70', controlBlur:'6', controlSaturation:'140', controlAberration:'2', controlElasticity:'0.15', controlRadius:'22', controlMode:'standard', controlBackdrop:'desktop' };
        for (const [id,value] of Object.entries(values)) $(`#${id}`).value = value;
        $('#controlOverLight').checked = false; $('#controlMotion').checked = false; updateCatalogControls();
      });
      render();
      renderCatalogNav(); renderCatalog(); updateCatalogControls();
      setInterval(updateProcessingClocks, 1000);
    </script>
  </body>
</html>
